hero_eyebrow: "Why we do it"
hero_title: "About Backcountry Pursuit"
hero_text: "A practical outdoor resource built around western hunting, fishing, camping, gear, and time spent learning outside."
idea_title: "The Idea"
idea_text: "Backcountry Pursuit exists to make outdoor information more useful. No endless gear hype. No pretending every trip is perfect. The goal is straightforward: share tactics that work, explain gear clearly, and help people spend more capable time outdoors."
find_title: "What You’ll Find Here"
find_text: "Expect elk and deer tactics, bowhunting and rifle content, fishing guides, camp systems, survival fundamentals, and honest buying guides."
principle_text: "Recommend gear because it solves a real problem—not because it has the biggest marketing budget."
family_image: "family-backcountry.webp"
family_eyebrow: "The Pursuit"
family_title: "Built Around Time Outside."
family_text1: "Backcountry Pursuit is grounded in real hunts, river days, family trips, pack-outs, camp stories, and lessons learned the hard way. The goal is useful outdoor information without pretending every trip is perfect."
family_text2: "The photos throughout the site come from real days in the field and on the water."
values_eyebrow: "What We Stand For"
values_title: "Useful Over Flashy"
value1_tag: "REAL USE"
value1_title: "Field First"
value1_text: "Tactics and gear should make sense on the mountain, at the river, and around camp."
value2_tag: "FAMILY"
value2_title: "Pass It On"
value2_text: "The best outdoor knowledge is worth teaching to kids, friends, and the next hunting partner."
value3_tag: "NO HYPE"
value3_title: "Earn the Recommendation"
value3_text: "Gear should be recommended because it solves a problem—not because it has the loudest marketing."
