media:
  input: media
  output: /media
  categories: [image]
  rename: safe

content:
  - name: site-pages
    label: Site Pages
    type: group
    items:
      - name: home
        label: Home Page
        type: file
        path: index.html
        format: code
        operations:
          delete: false
      - name: hunting
        label: Hunting Page
        type: file
        path: hunting.html
        format: code
        operations:
          delete: false
      - name: fishing
        label: Fishing Page
        type: file
        path: fishing.html
        format: code
        operations:
          delete: false
      - name: camping
        label: Camping Page
        type: file
        path: camping.html
        format: code
        operations:
          delete: false
      - name: survival
        label: Survival Page
        type: file
        path: survival.html
        format: code
        operations:
          delete: false
      - name: gear
        label: Gear Page
        type: file
        path: gear.html
        format: code
        operations:
          delete: false
      - name: guides-page
        label: Field Guides Page
        type: file
        path: guides.html
        format: code
        operations:
          delete: false
      - name: about
        label: About Page
        type: file
        path: about.html
        format: code
        operations:
          delete: false
      - name: contact
        label: Contact Page
        type: file
        path: contact.html
        format: code
        operations:
          delete: false
      - name: privacy
        label: Privacy Page
        type: file
        path: privacy.html
        format: code
        operations:
          delete: false

  - name: articles
    label: Articles & Stories
    type: collection
    path: content/articles
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      fields: [category]
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: category
        label: Category
        type: select
        required: true
        options:
          values:
            - Hunting
            - Fishing
            - Camping
            - Survival
            - Gear
            - Family Outdoors
      - name: image
        label: Main Photo
        type: image
      - name: description
        label: Short Description
        type: text
        required: true
      - name: body
        label: Article
        type: rich-text
        options:
          format: html

  - name: guides
    label: Field Guides
    type: collection
    path: content/guides
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      fields: [category]
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: category
        label: Category
        type: select
        required: true
        options:
          values:
            - Hunting
            - Fishing
            - Camping
            - Survival
            - Gear
            - Family Outdoors
      - name: image
        label: Main Photo
        type: image
      - name: description
        label: Short Description
        type: text
        required: true
      - name: legacy_path
        label: Website Address
        type: string
        required: true
      - name: body
        label: Guide Content
        type: rich-text
        options:
          format: html
