media:
  input: media
  output: /media
  categories: [image]
  rename: safe

content:
  - name: backcountry-updates
    label: From the Backcountry
    type: collection
    path: content/backcountry
    format: yaml-frontmatter
    filename: "{primary}.md"
    view: { primary: title, fields: [date, category] }
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: date, label: Date, type: date, required: true }
      - name: category
        label: Category
        type: select
        required: true
        options: { values: [Field Note, Hunting, Fishing, Camping, Scouting, Gear, Family Outdoors] }
      - { name: image, label: Photo, type: image }
      - { name: summary, label: Short Update, type: text, required: true }
      - name: body
        label: Story or Update
        type: rich-text
        options: { format: html }

  - name: articles
    label: Articles & Stories
    type: collection
    path: content/articles
    format: yaml-frontmatter
    filename: "{primary}.md"
    view: { primary: title, fields: [category] }
    fields:
      - { name: title, label: Title, type: string, required: true }
      - name: category
        label: Category
        type: select
        required: true
        options: { values: [Hunting, Fishing, Camping, Survival, Gear, Family Outdoors] }
      - { name: image, label: Main Photo, type: image }
      - { name: description, label: Short Description, type: text, required: true }
      - name: body
        label: Article
        type: rich-text
        options: { format: html }

  - name: guides
    label: Field Guides
    type: collection
    path: content/guides
    format: yaml-frontmatter
    filename: "{primary}.md"
    view: { primary: title, fields: [category] }
    fields:
      - { name: title, label: Title, type: string, required: true }
      - name: category
        label: Category
        type: select
        required: true
        options: { values: [Hunting, Fishing, Camping, Survival, Gear, Family Outdoors] }
      - { name: image, label: Main Photo, type: image }
      - { name: description, label: Short Description, type: text, required: true }
      - { name: legacy_path, label: Website Address, type: string, required: true }
      - name: body
        label: Guide Content
        type: rich-text
        options: { format: html }
