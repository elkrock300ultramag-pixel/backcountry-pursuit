name: Build CMS articles

on:
  push:
    branches:
      - main
    paths:
      - 'content/articles/**'
      - 'scripts/build-articles.js'
      - '.github/workflows/build-articles.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Build article pages
        run: node scripts/build-articles.js

      - name: Commit generated article pages
        run: |
          if git diff --quiet -- articles; then
            echo "No generated article changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles
          git commit -m "Build CMS article pages"
          git push
