name: Build editable website pages

on:
  push:
    branches: [cms-test]
    paths:
      - 'content/pages/**'
      - 'scripts/build-page-content.js'
      - 'scripts/finish-cms-test.js'
      - '.github/workflows/build-page-content-cms-test.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cms-test
      - name: Finish CMS wiring
        run: node scripts/finish-cms-test.js
      - name: Build editable pages
        run: node scripts/build-page-content.js
      - name: Commit generated pages and CMS wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .pages.yml scripts/build-articles.js index.html hunting.html fishing.html camping.html survival.html gear.html guides.html about.html contact.html privacy.html
          if git diff --cached --quiet; then
            echo "No generated page changes."
            exit 0
          fi
          git commit -m "Finish editable website CMS wiring"
          git push
